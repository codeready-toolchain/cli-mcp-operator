# Cluster-scoped MCP *client* RBAC the admin applies. Not created by the operator.
# Substitute the instance namespace (here: default).
# The operator creates ServiceAccount cli-mcp-server-<name> and binds it to
# system:auth-delegator (kube-rbac-proxy TokenReview / SubjectAccessReview).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cli-mcp-client
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cli-mcp-client
rules:
- nonResourceURLs:
  - /mcp
  - /metrics
  - /live
  - /health
  - /sessions
  - /sessions/*
  verbs:
  - get
  - create
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cli-mcp-client
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cli-mcp-client
subjects:
- kind: ServiceAccount
  name: cli-mcp-client
  namespace: default

# This rule is not used by the project cli-mcp-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over cli-mcp.redhat.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cli-mcp-operator
    app.kubernetes.io/managed-by: kustomize
  name: climcpinstance-admin-role
rules:
- apiGroups:
  - cli-mcp.redhat.com
  resources:
  - climcpinstances
  verbs:
  - '*'
- apiGroups:
  - cli-mcp.redhat.com
  resources:
  - climcpinstances/status
  verbs:
  - get

# Namespaced manager verbs for instance children and the secret trust boundary.
# Do not add these namespaced rules to ClusterRole manager-role.
# Cluster-scoped children (ClusterRoleBindings) belong on manager-role.
#
# OLM creates CSV `permissions` as a Role in the operator namespace, then copies
# that Role/RoleBinding into OperatorGroup targetNamespaces (SingleNamespace).
# make deploy applies this Role in the operator namespace (OwnNamespace).
# Leader election stays in the operator pod namespace (controller-runtime
# default), where the CSV permissions Role is created first.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: cli-mcp-operator
    app.kubernetes.io/managed-by: kustomize
  name: manager-namespaced-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - secrets
  - services
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

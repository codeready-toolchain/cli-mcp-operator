# This rule is not used by the project cli-mcp-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the cli-mcp.redhat.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cli-mcp-operator
    app.kubernetes.io/managed-by: kustomize
  name: climcpinstance-editor-role
rules:
- apiGroups:
  - cli-mcp.redhat.com
  resources:
  - climcpinstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cli-mcp.redhat.com
  resources:
  - climcpinstances/status
  verbs:
  - get

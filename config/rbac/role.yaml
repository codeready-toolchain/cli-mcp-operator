kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - cli-mcp.redhat.com
  resources:
  - climcpinstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cli-mcp.redhat.com
  resources:
  - climcpinstances/finalizers
  verbs:
  - update
- apiGroups:
  - cli-mcp.redhat.com
  resources:
  - climcpinstances/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  verbs:
  - create
- apiGroups:
  - rbac.authorization.k8s.io
  resourceNames:
  - cli-mcp-auth-delegator
  resources:
  - clusterrolebindings
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io

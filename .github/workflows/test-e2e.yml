name: E2E

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: Kind e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    # Kind, the 1.34 node image, and Calico come from the Makefile.
    # Runners provide Docker; local runs default to podman.
    - name: Run Kind e2e
      run: make test-e2e CONTAINER_TOOL=docker

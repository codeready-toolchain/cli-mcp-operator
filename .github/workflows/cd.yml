name: CD - Build & Push Images

on:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  IMAGE_REGISTRY: quay.io
  REGISTRY_USER: "codeready-toolchain+push"

jobs:
  build-and-push:
    name: Build and Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli-mcp-operator
            image: codeready-toolchain/cli-mcp-operator
            containerfile: Containerfile.operator
          - name: cli-mcp-server
            image: codeready-toolchain/cli-mcp-server
            containerfile: Containerfile.server
          - name: cli-mcp-sandbox
            image: codeready-toolchain/cli-mcp-sandbox
            containerfile: Containerfile.agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set short SHA
        run: echo "COMMIT_SHORT_SHA=$(git rev-parse --short ${GITHUB_SHA})" >> "${GITHUB_ENV}"

      - name: Set build time
        run: echo "BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_ENV}"

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ matrix.image }}
          tags: latest ${{ env.COMMIT_SHORT_SHA }}
          containerfiles: |
            ${{ matrix.containerfile }}
          platforms: linux/amd64
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}

      - name: Log into quay.io
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push image to quay.io
        id: push-to-quay
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Print image url
        run: echo "Image pushed to ${{ steps.push-to-quay.outputs.registry-paths }}"

  catalog:
    name: Build and Push catalog
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set image tags
        run: echo "COMMIT_SHORT_SHA=$(git rev-parse --short ${GITHUB_SHA})" >> "${GITHUB_ENV}"

      - name: Generate bundle with SHA-tagged relatedImages
        run: make generate-cd-release-manifests GIT_SHORT_SHA="${COMMIT_SHORT_SHA}"

      - name: Log into quay.io
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build bundle image
        id: build-bundle
        uses: redhat-actions/buildah-build@v2
        with:
          image: codeready-toolchain/cli-mcp-operator-bundle
          tags: latest ${{ env.COMMIT_SHORT_SHA }} v0.0.1
          containerfiles: |
            bundle.Dockerfile
          platforms: linux/amd64
          context: .

      - name: Push bundle image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-bundle.outputs.image }}
          tags: ${{ steps.build-bundle.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Render catalog
        run: make catalog-render BUNDLE_IMG="${IMAGE_REGISTRY}/codeready-toolchain/cli-mcp-operator-bundle:${COMMIT_SHORT_SHA}"

      - name: Build catalog image
        id: build-catalog
        uses: redhat-actions/buildah-build@v2
        with:
          image: codeready-toolchain/cli-mcp-operator-catalog
          tags: latest ${{ env.COMMIT_SHORT_SHA }} v0.0.1
          containerfiles: |
            catalog.Dockerfile
          platforms: linux/amd64
          context: .

      - name: Push catalog image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-catalog.outputs.image }}
          tags: ${{ steps.build-catalog.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
